[project]
name = "spinev-ble"
version = "0.3.0"
description = "local bluetooth le control for exicom spin ev chargers"
authors = [
    { name = "Dr-Blank", email = "64108942+Dr-Blank@users.noreply.github.com" },
]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
keywords = [
    "exicom",
    "spin ev",
    "spin air",
    "ev charger",
    "evse",
    "bluetooth",
    "ble",
    "home assistant",
    "bleak",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Only needed if you use the bundled bleak client or the CLI. The protocol codec
# itself has no dependencies at all.
bleak = ["bleak>=0.22.0", "bleak-retry-connector>=4.0.0"]

[project.scripts]
spinev-ble = "spinev_ble.__main__:main"

[project.urls]
Homepage = "https://github.com/Dr-Blank/spinev-ble"
Repository = "https://github.com/Dr-Blank/spinev-ble"
Issues = "https://github.com/Dr-Blank/spinev-ble/issues"

[dependency-groups]
dev = [
    "bleak>=0.22.0",
    "bleak-retry-connector>=4.0.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
    "pylint>=3.3.7",
    "prek>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spinev_ble"]

[tool.hatch.build.targets.sdist]
include = ["src/spinev_ble", "tests", "README.md", "LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "RUF",  # ruff specific
    "ASYNC",
]
ignore = [
    # Prose in docstrings and comments is not wrapped. The formatter still keeps
    # code within line-length; long sentences are left alone deliberately.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
files = ["src/spinev_ble", "tests"]

[[tool.mypy.overrides]]
module = ["bleak_retry_connector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/spinev_ble"]


[tool.pylint.messages_control]
disable = [
    "line-too-long",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "duplicate-code",
]

[tool.pylint.design]
# SpinEvCharger is one accessor per charger register, so the count tracks the
# device's surface rather than the class doing too much.
max-public-methods = 40
